name: Deployment
on:
  push:
    branches:
      - main
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Load and Cache
        id: load-n-cache
        uses: ./.github/actions/cached-deps
      - name: Custom cache action output info
        run: echo "Cache used -> ${{ steps.load-n-cache.outputs.used-cache }}"
      - name: Lint code
        run: npm run lint
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Load and Cache
        id: load-n-cache
        uses: ./.github/actions/cached-deps
        with:
          caching: 'false'
      - name: Custom cache action output info
        run: echo "Cache used -> ${{ steps.load-n-cache.outputs.used-cache }}"
      - name: Test code
        id: run-tests
        run: npm run test
      - name: Upload test report
        if: failure() && steps.run-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: test.json
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Load and Cache
        uses: ./.github/actions/cached-deps
      - name: Build website
        run: npm run build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-files
          path: dist
  deploy:
    # Permissions for AWS OpenID connect
    permissions:
      id-token: write   # This is required for requesting the JWT
      contents: read    # This is required for actions/checkout
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Get build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist-files
          path: ./dist
      - name: Output contents
        run: ls
      # JS custom action
      # - name: Deploy site
      #   id: deploy-site
      #   uses: ./.github/actions/deploy-s3-js
      #   with:
      #     bucket: node-action-demo-app
      #     bucket-region: us-east-1
      #     files-dir: ./dist
      #   env:
      #     AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # Docker custom action
      # - name: Deploy site
      #   id: deploy-site
      #   uses: ./.github/actions/deploy-s3-docker
      #   with:
      #     bucket: node-action-demo-app
      #     bucket-region: us-east-1
      #     files-dir: ./dist
      #   env:
      #     AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # Docker custom action with AWS OpenID connect
      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          # restore base64 padding
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "$PAYLOAD" | base64 -d | jq '{sub, aud, repository, ref}'
      - name: Configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6.2.2
        with:
          role-to-assume: arn:aws:iam::332053469066:role/GitHubDeploy
          aws-region: us-east-1
      - name: Deploy site
        id: deploy-site
        uses: ./.github/actions/deploy-s3-docker
        with:
          bucket: node-action-demo-app
          bucket-region: us-east-1
          files-dir: ./dist
      - name: Get Website endpoint
        run: echo "${{ steps.deploy-site.outputs.site-url }}"